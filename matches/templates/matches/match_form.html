{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>{{ title }}</h1>

    <nav>
        <a href="{% url 'matches:matches_list' %}">Все матчи</a>
        <a href="{% url 'matches:matches_live' %}">Live</a>
        <a href="{% url 'matches:matches_future' %}">Будущие</a>
        <a href="{% url 'matches:tournaments_list' %}">Турниры</a>
    </nav>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <ul class="errorlist">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {{ form.as_p }}

        <p>
            <button type="submit" class="btn btn-primary">
                {% if action == 'create' %}Создать{% else %}Сохранить{% endif %}
            </button>

            {% if action == 'edit' %}
                <a class="btn" href="{% url 'matches:match_detail' match.id %}">Отмена</a>
            {% else %}
                <a class="btn" href="{% url 'matches:matches_list' %}">Отмена</a>
            {% endif %}
        </p>
    </form>
</body>
</html>
