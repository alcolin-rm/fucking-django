<!DOCTYPE html>
<html>
<head>
    <title>Удаление матча</title>
</head>
<body>
     {% include 'matches/_header.html' %}
    <h1>Удалить матч?</h1>
    <p>
        Вы уверены, что хотите удалить матч
        «{{ match.team1 }} – {{ match.team2 }}» ({{ match.location }})?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Да, удалить</button>
        <a href="{% url 'matches:match_detail' match.id %}">Отмена</a>
    </form>
</body>
</html>
