{% load static %}
<header class="site-header">
    <div class="site-header-left">
        <a href="{% url 'matches:matches_list' %}" class="site-logo">⚽ SportSite</a>
    </div>

    <nav class="site-header-nav">
        <a href="{% url 'matches:matches_list' %}">Все</a>
        <a href="{% url 'matches:matches_live' %}">Live</a>
        <a href="{% url 'matches:matches_future' %}">Будущие</a>
        <a href="{% url 'matches:tournaments_list' %}">Турниры</a>
    </nav>

    <div class="site-header-user">
        {% if user.is_authenticated %}
            {% if user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" alt="avatar" class="avatar">
            {% else %}
                <span class="avatar avatar-placeholder">{{ user.username|first|upper }}</span>
            {% endif %}
            <span class="username">{{ user.username }}</span>
            {% if user.is_staff %}
                <a class="btn btn-small" href="/admin/">Админка</a>
            {% endif %}
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline; background:none; padding:0; box-shadow:none; max-width:none;">
                {% csrf_token %}
                <button type="submit" class="btn btn-small">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-small" href="{% url 'accounts:login' %}">Войти</a>
            <a class="btn btn-small btn-primary" href="{% url 'accounts:register' %}">Регистрация</a>
        {% endif %}
    </div>
</header>
